[package]
name = "vitrola-bt"
version = "0.3.4"
edition = "2021"
description = "Ouça e grave sua vitrola Bluetooth no Linux: o PC vira caixa de som (A2DP Sink)"
license = "MIT"
repository = "https://github.com/4snt/vitrola-bt"
authors = ["Murilo Santiago <murilo.escobedo@protonmail.com>"]
rust-version = "1.82"

[[bin]]
name = "vitrola-bt"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.29"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
libloading = "0.8"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
png = "0.17"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "signal"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "4", default-features = false, features = ["tokio"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
