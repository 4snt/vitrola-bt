name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  NFPM_VERSION: v2.41.0
  CARGO_TERM_COLOR: always

jobs:
  rust:
    # Ubuntu 22.04 (glibc 2.35): o mesmo binário roda do Debian 12 ao Arch
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libsbc1 shellcheck desktop-file-utils
      - name: Formatação
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings
      - name: Testes
        run: cargo test --release --locked
      - name: Compila
        run: cargo build --release --locked
      - name: Scripts e .desktop
        run: |
          shellcheck bin/vitrola packaging/*.sh packaging/classe-caixa
          desktop-file-validate data/*.desktop
          python3 -c "import xml.dom.minidom as m; m.parse('packaging/io.github._4snt.VitrolaBT.policy')"
      - name: Instala o nFPM
        run: |
          curl -fsSL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${NFPM_VERSION#v}_amd64.deb"
          sudo apt-get install -y /tmp/nfpm.deb
      - name: Gera .deb, .rpm, .pkg.tar.zst e .tar.gz
        run: packaging/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vitrola-bt-pacotes
          path: dist/*

  windows:
    # Prévia: a interface compila e abre no Windows; o receptor Bluetooth ainda é só Linux
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Compila
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: vitrola-bt-windows-previa
          path: target/release/vitrola-bt.exe

  instalar:
    needs: rust
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: ["ubuntu:24.04", "ubuntu:22.04", "debian:12", "fedora:42", "archlinux:latest"]
    container: ${{ matrix.distro }}
    name: instalar (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vitrola-bt-pacotes
          path: dist
      - name: Instala o pacote e confere binário, bibliotecas e arquivos
        run: bash packaging/test-install.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [instalar, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vitrola-bt-pacotes
          path: dist
      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          previa=""
          case "$TAG" in *-*) previa="--prerelease" ;; esac
          gh release create "$TAG" dist/* --repo "${{ github.repository }}" --title "$TAG" --generate-notes $previa
