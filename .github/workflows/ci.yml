name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

env:
  NFPM_VERSION: v2.41.0

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck desktop-file-utils python3-gi python3-dbus gir1.2-gtk-3.0
          pipx install ruff
      - name: shellcheck
        run: shellcheck bin/vitrola packaging/*.sh
      - name: ruff
        run: ruff check vitrola_bt bin/vitrola-gui
      - name: Importa os módulos
        run: python3 -c "import vitrola_bt.agente, vitrola_bt.gui"
      - name: Valida o .desktop
        run: desktop-file-validate data/*.desktop
      - name: Ajuda do CLI
        run: bin/vitrola --help

  pacotes:
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Instala o nFPM
        run: |
          curl -fsSL -o /tmp/nfpm.deb \
            "https://github.com/goreleaser/nfpm/releases/download/${NFPM_VERSION}/nfpm_${NFPM_VERSION#v}_amd64.deb"
          sudo apt-get install -y /tmp/nfpm.deb
      - name: Gera .deb, .rpm, .pkg.tar.zst e .tar.gz
        run: packaging/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: vitrola-bt-pacotes
          path: dist/*

  instalar:
    needs: pacotes
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        distro: ["ubuntu:24.04", "ubuntu:22.04", "debian:12", "fedora:42", "archlinux:latest"]
    container: ${{ matrix.distro }}
    name: instalar (${{ matrix.distro }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: vitrola-bt-pacotes
          path: dist
      - name: Instala o pacote e confere comandos/arquivos
        run: bash packaging/test-install.sh

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: instalar
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vitrola-bt-pacotes
          path: dist
      - name: Publica a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes
