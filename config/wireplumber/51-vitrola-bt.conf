# vitrola-bt — WirePlumber 0.5
# Faz o PC funcionar como RECEPTOR Bluetooth (A2DP Sink) de alta qualidade
# para a vitrola Polyvox XTD-67, sem quebrar fones/caixas BT já usados.
# Instalado em: ~/.config/wireplumber/wireplumber.conf.d/

monitor.bluez.properties = {
  # a2dp_sink = o PC recebe áudio (vitrola -> PC)
  # a2dp_source = o PC envia áudio (PC -> fone/caixa), mantido p/ não quebrar o HB20
  bluez5.roles = [ a2dp_sink a2dp_source bap_sink bap_source hfp_hf hfp_ag hsp_hs hsp_ag ]

  # Codecs anunciados, do melhor para o pior. Quem escolhe é o transmissor
  # (a vitrola); anunciar todos garante que ela use o melhor que suportar.
  # Obs.: LDAC não tem decodificador livre — o Linux só pode ENVIAR LDAC, não receber.
  bluez5.codecs = [ aptx_hd aptx aac sbc_xq sbc ]

  # SBC-XQ: SBC com bitpool alto (~552 kbps). Grande ganho quando a vitrola só tem SBC.
  bluez5.enable-sbc-xq = true
  bluez5.enable-msbc = true
  bluez5.enable-hw-volume = true
}

wireplumber.settings = {
  # Nunca trocar sozinho para o perfil "headset" (HFP, 16 kHz mono = som de telefone)
  bluetooth.autoswitch-to-headset-profile = false
}

monitor.bluez.rules = [
  {
    # Nó de entrada criado quando a vitrola transmite para o PC
    matches = [ { node.name = "~bluez_input.*" } ]
    actions = {
      update-props = {
        # Buffer um pouco maior = menos estalos/cortes em rádio 2.4 GHz congestionado
        node.latency = "1024/48000"
        # Não suspender o nó entre faixas (evita "clique" e perda do início)
        session.suspend-timeout-seconds = 0
        priority.session = 2100
      }
    }
  }
]
